<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrewGo - Squadre</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            background: white;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .disable {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div class="top">

        <div>
            <h1>Squadre</h1>

            <div class="subtitle">
                Organizza squadre, capisquadra, operai e cantieri.
            </div>
        </div>

        <button class="add-button" onclick="apriNuovaSquadra()">
            + AGGIUNGI SQUADRA
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleSquadre">
                0
            </div>

            <div class="stat-label">
                Totale squadre
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="squadreAttive">
                0
            </div>

            <div class="stat-label">
                Squadre attive
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="squadreInattive">
                0
            </div>

            <div class="stat-label">
                Squadre non attive
            </div>
        </div>

    </div>


    <input
        class="search"
        id="ricerca"
        type="text"
        placeholder="🔍 Cerca squadra, caposquadra o cantiere..."
        oninput="mostraSquadre()"
    >


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Squadra</th>
                    <th>Caposquadra</th>
                    <th>Cantiere</th>
                    <th>Operai</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody id="tabellaSquadre">
            </tbody>

        </table>

    </div>

</main>


<div class="modal" id="modalSquadra">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Aggiungi squadra
            </h2>

            <button class="close" onclick="chiudiModal()">
                ×
            </button>

        </div>


        <form id="formSquadra">

            <input type="hidden" id="squadraId">


            <div class="form-grid">

                <div class="form-group">

                    <label for="nome">
                        Nome squadra
                    </label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Es. Squadra Milano"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="caposquadra">
                        Caposquadra
                    </label>

                    <input
                        id="caposquadra"
                        type="text"
                        placeholder="Nome caposquadra"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label for="cantiere">
                        Cantiere assegnato
                    </label>

                    <input
                        id="cantiere"
                        type="text"
                        placeholder="Es. Fiera Milano"
                    >

                </div>


                <div class="form-group">

                    <label for="operai">
                        Numero operai
                    </label>

                    <input
                        id="operai"
                        type="number"
                        min="0"
                        value="0"
                    >

                </div>


                <div class="form-group">

                    <label for="stato">
                        Stato
                    </label>

                    <select id="stato">

                        <option value="Attiva">
                            Attiva
                        </option>

                        <option value="Non attiva">
                            Non attiva
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA SQUADRA
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let squadre = JSON.parse(
        localStorage.getItem("crewgo_squadre") || "[]"
    );


    function salvaDati() {

        localStorage.setItem(
            "crewgo_squadre",
            JSON.stringify(squadre)
        );

    }


    function generaId() {

        return Date.now().toString();

    }


    function apriNuovaSquadra() {

        document
            .getElementById("formSquadra")
            .reset();

        document
            .getElementById("squadraId")
            .value = "";

        document
            .getElementById("operai")
            .value = 0;

        document
            .getElementById("titoloModal")
            .textContent = "Aggiungi squadra";

        document
            .getElementById("modalSquadra")
            .classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalSquadra")
            .classList.remove("show");

    }


    document
        .getElementById("formSquadra")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const id =
                document.getElementById("squadraId").value;


            const squadra = {

                id: id || generaId(),

                nome:
                    document.getElementById("nome").value.trim(),

                caposquadra:
                    document.getElementById("caposquadra").value.trim(),

                cantiere:
                    document.getElementById("cantiere").value.trim(),

                operai:
                    Number(
                        document.getElementById("operai").value
                    ) || 0,

                stato:
                    document.getElementById("stato").value

            };


            if (id) {

                const indice =
                    squadre.findIndex(
                        item => item.id === id
                    );


                if (indice !== -1) {

                    squadre[indice] = squadra;

                }

            } else {

                squadre.push(squadra);

            }


            salvaDati();

            mostraSquadre();

            chiudiModal();

        });


    function modificaSquadra(id) {

        const squadra =
            squadre.find(
                item => item.id === id
            );


        if (!squadra) {
            return;
        }


        document.getElementById("squadraId").value =
            squadra.id;

        document.getElementById("nome").value =
            squadra.nome;

        document.getElementById("caposquadra").value =
            squadra.caposquadra;

        document.getElementById("cantiere").value =
            squadra.cantiere;

        document.getElementById("operai").value =
            squadra.operai;

        document.getElementById("stato").value =
            squadra.stato;


        document.getElementById("titoloModal").textContent =
            "Modifica squadra";


        document
            .getElementById("modalSquadra")
            .classList.add("show");

    }


    function cambiaStato(id) {

        const squadra =
            squadre.find(
                item => item.id === id
            );


        if (!squadra) {
            return;
        }


        if (squadra.stato === "Attiva") {

            squadra.stato = "Non attiva";

        } else {

            squadra.stato = "Attiva";

        }


        salvaDati();

        mostraSquadre();

    }


    function eliminaSquadra(id) {

        const conferma =
            confirm(
                "Sei sicuro di voler eliminare questa squadra?"
            );


        if (!conferma) {
            return;
        }


        squadre =
            squadre.filter(
                item => item.id !== id
            );


        salvaDati();

        mostraSquadre();

    }


    function mostraSquadre() {

        const tbody =
            document.getElementById("tabellaSquadre");

        const ricerca =
            document
                .getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();


        const filtrate =
            squadre.filter(squadra => {

                const testo = (

                    squadra.nome + " " +
                    squadra.caposquadra + " " +
                    squadra.cantiere

                ).toLowerCase();


                return testo.includes(ricerca);

            });


        tbody.innerHTML = "";


        if (filtrate.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty">
                            ${
                                squadre.length === 0
                                ? "Nessuna squadra inserita."
                                : "Nessun risultato trovato."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            filtrate.forEach(squadra => {

                const riga =
                    document.createElement("tr");


                const classeStato =
                    squadra.stato === "Attiva"
                    ? "active"
                    : "inactive";


                riga.innerHTML = `

                    <td class="name">
                        ${escapeHtml(squadra.nome)}
                    </td>

                    <td>
                        ${escapeHtml(squadra.caposquadra)}
                    </td>

                    <td>
                        ${escapeHtml(squadra.cantiere || "Da assegnare")}
                    </td>

                    <td>
                        ${squadra.operai}
                    </td>

                    <td>
                        <span class="status ${classeStato}">
                            ${escapeHtml(squadra.stato)}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-button edit"
                            onclick="modificaSquadra('${squadra.id}')"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button disable"
                            onclick="cambiaStato('${squadra.id}')"
                        >
                            ${
                                squadra.stato === "Attiva"
                                ? "Disattiva"
                                : "Attiva"
                            }
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaSquadra('${squadra.id}')"
                        >
                            Elimina
                        </button>

                    </td>

                `;


                tbody.appendChild(riga);

            });

        }


        aggiornaStatistiche();

    }


    function aggiornaStatistiche() {

        const totale =
            squadre.length;


        const attive =
            squadre.filter(
                item => item.stato === "Attiva"
            ).length;


        const inattive =
            squadre.filter(
                item => item.stato === "Non attiva"
            ).length;


        document.getElementById("totaleSquadre")
            .textContent = totale;

        document.getElementById("squadreAttive")
            .textContent = attive;

        document.getElementById("squadreInattive")
            .textContent = inattive;

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById("modalSquadra");


            if (event.target === modal) {

                chiudiModal();

            }

        }
    );


    mostraSquadre();

</script>

</body>
</html>
