<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewGo - Squadre</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1300px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .people {
            background: #ede9fe;
            color: #6d28d9;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty,
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .people-list {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .person-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #f8fafc;
        }

        .person-name {
            font-weight: bold;
        }

        .assign-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 700px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div id="errore" class="error"></div>


    <div class="top">

        <div>
            <h1>Squadre</h1>

            <div class="subtitle">
                Organizza squadre, capisquadra, cantieri e operai.
            </div>
        </div>

        <button
            class="add-button"
            onclick="apriNuovaSquadra()"
        >
            + AGGIUNGI SQUADRA
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleSquadre">0</div>
            <div class="stat-label">Totale squadre</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="squadreAttive">0</div>
            <div class="stat-label">Squadre attive</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totaleAssegnati">0</div>
            <div class="stat-label">Operai assegnati</div>
        </div>

    </div>


    <div class="filters">

        <input
            id="ricerca"
            type="text"
            placeholder="🔍 Cerca squadra, caposquadra o cantiere..."
            oninput="mostraSquadre()"
        >

        <select
            id="filtroStato"
            onchange="mostraSquadre()"
        >
            <option value="">Tutti gli stati</option>
            <option value="Attiva">Attive</option>
            <option value="Non attiva">Non attive</option>
        </select>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Squadra</th>
                    <th>Caposquadra</th>
                    <th>Cantiere</th>
                    <th>Operai</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>


            <tbody id="tabellaSquadre">

                <tr>
                    <td colspan="6">
                        <div class="loading">
                            Caricamento squadre...
                        </div>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- =====================================================
     MODALE SQUADRA
===================================================== -->

<div
    class="modal"
    id="modalSquadra"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Aggiungi squadra
            </h2>

            <button
                class="close"
                onclick="chiudiModal()"
            >
                ×
            </button>

        </div>


        <form id="formSquadra">

            <input
                type="hidden"
                id="squadraId"
            >


            <div class="form-grid">

                <div class="form-group">

                    <label for="nome">
                        Nome squadra *
                    </label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Es. Squadra Milano"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="caposquadra">
                        Caposquadra
                    </label>

                    <select id="caposquadra">

                        <option value="">
                            Nessun caposquadra
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="cantiere">
                        Cantiere
                    </label>

                    <select id="cantiere">

                        <option value="">
                            Nessun cantiere
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="stato">
                        Stato
                    </label>

                    <select id="stato">

                        <option value="Attiva">
                            Attiva
                        </option>

                        <option value="Non attiva">
                            Non attiva
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA SQUADRA
                </button>

            </div>

        </form>

    </div>

</div>


<!-- =====================================================
     MODALE OPERAI
===================================================== -->

<div
    class="modal"
    id="modalOperai"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Operai della squadra
            </h2>

            <button
                class="close"
                onclick="chiudiOperai()"
            >
                ×
            </button>

        </div>


        <div id="nomeSquadraOperai"></div>


        <div
            class="people-list"
            id="listaOperaiSquadra"
        >
        </div>


        <div class="assign-box">

            <label for="operaioDaAssegnare">
                Aggiungi operaio
            </label>

            <select id="operaioDaAssegnare">

                <option value="">
                    Seleziona operaio
                </option>

            </select>


            <button
                class="save"
                style="margin-top: 12px;"
                onclick="assegnaOperaio()"
            >
                ASSEGNA ALLA SQUADRA
            </button>

        </div>

    </div>

</div>


<script>

    let squadre = [];

    let operai = [];

    let cantieri = [];

    let squadraOperaiId = null;


    function mostraErrore(messaggio) {

        const box =
            document.getElementById("errore");

        box.textContent =
            messaggio;

        box.style.display =
            "block";
    }


    function nascondiErrore() {

        document
            .getElementById("errore")
            .style.display =
            "none";
    }


    async function caricaDati() {

        try {

            nascondiErrore();

            const risposta =
                await fetch(
                    "/api/dati-collegamento"
                );

            if (!risposta.ok) {

                throw new Error(
                    "Impossibile caricare i dati."
                );
            }

            const dati =
                await risposta.json();

            operai =
                dati.operai || [];

            cantieri =
                dati.cantieri || [];

            await caricaSquadre();

        } catch (errore) {

            mostraErrore(
                errore.message
            );
        }
    }


    async function caricaSquadre() {

        const risposta =
            await fetch(
                "/api/squadre"
            );

        if (!risposta.ok) {

            throw new Error(
                "Impossibile caricare le squadre."
            );
        }

        squadre =
            await risposta.json();

        mostraSquadre();
    }


    function riempiCapisquadra(
        caposquadraId = ""
    ) {

        const select =
            document.getElementById(
                "caposquadra"
            );

        select.innerHTML = `
            <option value="">
                Nessun caposquadra
            </option>
        `;


        operai
            .filter(
                operaio =>
                    operaio.stato === "Attivo"
            )
            .forEach(operaio => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    operaio.id;

                option.textContent =
                    operaio.nome +
                    " " +
                    operaio.cognome;

                if (
                    String(operaio.id) ===
                    String(caposquadraId)
                ) {

                    option.selected =
                        true;
                }

                select.appendChild(
                    option
                );

            });
    }


    function riempiCantieri(
        cantiereId = ""
    ) {

        const select =
            document.getElementById(
                "cantiere"
            );

        select.innerHTML = `
            <option value="">
                Nessun cantiere
            </option>
        `;


        cantieri.forEach(cantiere => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                cantiere.id;

            option.textContent =
                cantiere.nome +
                " — " +
                cantiere.cliente;

            if (
                String(cantiere.id) ===
                String(cantiereId)
            ) {

                option.selected =
                    true;
            }

            select.appendChild(
                option
            );

        });
    }


    function apriNuovaSquadra() {

        document
            .getElementById("formSquadra")
            .reset();

        document
            .getElementById("squadraId")
            .value = "";

        riempiCapisquadra();

        riempiCantieri();

        document
            .getElementById("titoloModal")
            .textContent =
            "Aggiungi squadra";

        document
            .getElementById("modalSquadra")
            .classList.add("show");
    }


    function chiudiModal() {

        document
            .getElementById("modalSquadra")
            .classList.remove("show");
    }


    function modificaSquadra(id) {

        const squadra =
            squadre.find(
                item =>
                    item.id === id
            );

        if (!squadra) {
            return;
        }


        document
            .getElementById("squadraId")
            .value =
            squadra.id;


        document
            .getElementById("nome")
            .value =
            squadra.nome || "";


        /*
         * La nuova versione usa caposquadra_id.
         * Se una vecchia squadra non lo possiede ancora,
         * proviamo a ricavarlo dal nome precedente.
         */

        let caposquadraId =
            squadra.caposquadra_id || "";


        if (
            !caposquadraId &&
            squadra.caposquadra
        ) {

            const nomeVecchio =
                squadra.caposquadra
                    .trim()
                    .toLowerCase();


            const trovato =
                operai.find(operaio => {

                    const nomeCompleto =
                        (
                            operaio.nome +
                            " " +
                            operaio.cognome
                        )
                        .trim()
                        .toLowerCase();

                    return (
                        nomeCompleto ===
                        nomeVecchio
                    );

                });


            if (trovato) {

                caposquadraId =
                    trovato.id;
            }
        }


        riempiCapisquadra(
            caposquadraId
        );


        riempiCantieri(
            squadra.cantiere_id || ""
        );


        document
            .getElementById("stato")
            .value =
            squadra.stato || "Attiva";


        document
            .getElementById("titoloModal")
            .textContent =
            "Modifica squadra";


        document
            .getElementById("modalSquadra")
            .classList.add("show");
    }


    document
        .getElementById("formSquadra")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                nascondiErrore();


                const id =
                    document
                        .getElementById("squadraId")
                        .value;


                const caposquadraSelect =
                    document
                        .getElementById(
                            "caposquadra"
                        );


                const caposquadraId =
                    caposquadraSelect.value ||
                    null;


                const caposquadraNome =
                    caposquadraId
                    ? caposquadraSelect
                        .options[
                            caposquadraSelect
                                .selectedIndex
                        ]
                        .textContent
                    : "";


                const dati = {

                    nome:
                        document
                            .getElementById("nome")
                            .value
                            .trim(),

                    caposquadra_id:
                        caposquadraId
                        ? Number(
                            caposquadraId
                        )
                        : null,

                    caposquadra:
                        caposquadraNome,

                    cantiere_id:
                        document
                            .getElementById("cantiere")
                            .value
                        ? Number(
                            document
                                .getElementById(
                                    "cantiere"
                                )
                                .value
                          )
                        : null,

                    stato:
                        document
                            .getElementById("stato")
                            .value
                };


                try {

                    let risposta;


                    if (id) {

                        risposta =
                            await fetch(
                                `/api/squadre/${id}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            dati
                                        )
                                }
                            );

                    } else {

                        risposta =
                            await fetch(
                                "/api/squadre",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            dati
                                        )
                                }
                            );
                    }


                    const risultato =
                        await risposta.json();


                    if (!risposta.ok) {

                        throw new Error(
                            risultato.errore ||
                            "Errore durante il salvataggio."
                        );
                    }


                    chiudiModal();

                    await caricaDati();

                } catch (errore) {

                    mostraErrore(
                        errore.message
                    );
                }

            }
        );


    async function eliminaSquadra(id) {

        if (!confirm(
            "Sei sicuro di voler eliminare questa squadra?"
        )) {

            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/squadre/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante l'eliminazione."
                );
            }


            await caricaDati();

        } catch (errore) {

            mostraErrore(
                errore.message
            );
        }
    }


    async function apriOperai(id) {

        squadraOperaiId =
            id;


        const squadra =
            squadre.find(
                item =>
                    item.id === id
            );


        if (!squadra) {
            return;
        }


        document
            .getElementById(
                "nomeSquadraOperai"
            )
            .textContent =
            "Squadra: " +
            squadra.nome;


        riempiOperai();


        document
            .getElementById(
                "modalOperai"
            )
            .classList.add("show");


        await caricaOperaiSquadra();
    }


    function chiudiOperai() {

        document
            .getElementById(
                "modalOperai"
            )
            .classList.remove("show");

        squadraOperaiId =
            null;
    }


    function riempiOperai() {

        const select =
            document.getElementById(
                "operaioDaAssegnare"
            );


        select.innerHTML = `
            <option value="">
                Seleziona operaio
            </option>
        `;


        operai
            .filter(
                operaio =>
                    operaio.stato === "Attivo"
            )
            .forEach(operaio => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    operaio.id;

                option.textContent =
                    operaio.nome +
                    " " +
                    operaio.cognome;

                select.appendChild(
                    option
                );
            });
    }


    async function caricaOperaiSquadra() {

        if (!squadraOperaiId) {
            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/squadre/${squadraOperaiId}/operai`
                );


            if (!risposta.ok) {

                throw new Error(
                    "Impossibile caricare gli operai della squadra."
                );
            }


            const assegnati =
                await risposta.json();


            const lista =
                document.getElementById(
                    "listaOperaiSquadra"
                );


            lista.innerHTML = "";


            if (
                assegnati.length === 0
            ) {

                lista.innerHTML = `
                    <div class="empty">
                        Nessun operaio assegnato.
                    </div>
                `;

                return;
            }


            assegnati.forEach(operaio => {

                const elemento =
                    document.createElement(
                        "div"
                    );


                elemento.className =
                    "person-row";


                const squadra =
                    squadre.find(
                        item =>
                            item.id ===
                            squadraOperaiId
                    );


                const isCaposquadra =
                    squadra &&
                    squadra.caposquadra_id &&
                    Number(
                        squadra.caposquadra_id
                    ) === Number(
                        operaio.id
                    );


                elemento.innerHTML = `

                    <div>

                        <div class="person-name">

                            ${escapeHtml(
                                operaio.nome
                            )}

                            ${escapeHtml(
                                operaio.cognome
                            )}

                            ${
                                isCaposquadra
                                ? " ⭐ CAPOSQUADRA"
                                : ""
                            }

                        </div>

                        <small>
                            ${escapeHtml(
                                operaio.mansione || ""
                            )}
                        </small>

                    </div>

                `;


                lista.appendChild(
                    elemento
                );

            });

        } catch (errore) {

            mostraErrore(
                errore.message
            );
        }
    }


    async function assegnaOperaio() {

        const operaioId =
            document
                .getElementById(
                    "operaioDaAssegnare"
                )
                .value;


        if (!squadraOperaiId) {
            return;
        }


        if (!operaioId) {

            alert(
                "Seleziona un operaio."
            );

            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/squadre/${squadraOperaiId}/operai`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                operaio_id:
                                    Number(
                                        operaioId
                                    )
                            })
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante l'assegnazione."
                );
            }


            document
                .getElementById(
                    "operaioDaAssegnare"
                )
                .value = "";


            await caricaDati();

            await caricaOperaiSquadra();

        } catch (errore) {

            mostraErrore(
                errore.message
            );
        }
    }


    function mostraSquadre() {

        const tbody =
            document.getElementById(
                "tabellaSquadre"
            );


        const ricerca =
            document
                .getElementById(
                    "ricerca"
                )
                .value
                .toLowerCase()
                .trim();


        const filtroStato =
            document
                .getElementById(
                    "filtroStato"
                )
                .value;


        const filtrate =
            squadre.filter(
                squadra => {

                    const testo = (

                        squadra.nome +
                        " " +
                        (
                            squadra.caposquadra ||
                            ""
                        ) +
                        " " +
                        (
                            squadra.cantiere_nome ||
                            ""
                        )

                    ).toLowerCase();


                    return (
                        testo.includes(
                            ricerca
                        ) &&
                        (
                            !filtroStato ||
                            squadra.stato ===
                            filtroStato
                        )
                    );
                }
            );


        tbody.innerHTML = "";


        if (
            filtrate.length === 0
        ) {

            tbody.innerHTML = `
                <tr>

                    <td colspan="6">

                        <div class="empty">

                            ${
                                squadre.length === 0
                                ? "Nessuna squadra presente nel database."
                                : "Nessun risultato trovato."
                            }

                        </div>

                    </td>

                </tr>
            `;

        } else {

            filtrate.forEach(
                squadra => {

                    const riga =
                        document.createElement(
                            "tr"
                        );


                    const classe =
                        squadra.stato ===
                        "Attiva"
                        ? "active"
                        : "inactive";


                    let nomeCaposquadra =
                        squadra.caposquadra ||
                        "Nessun caposquadra";


                    if (
                        squadra.caposquadra_id
                    ) {

                        const operaio =
                            operai.find(
                                item =>
                                    Number(
                                        item.id
                                    ) ===
                                    Number(
                                        squadra.caposquadra_id
                                    )
                            );


                        if (operaio) {

                            nomeCaposquadra =
                                operaio.nome +
                                " " +
                                operaio.cognome;
                        }
                    }


                    riga.innerHTML = `

                        <td class="name">

                            ${escapeHtml(
                                squadra.nome
                            )}

                        </td>

                        <td>

                            ${escapeHtml(
                                nomeCaposquadra
                            )}

                        </td>

                        <td>

                            ${escapeHtml(
                                squadra.cantiere_nome ||
                                "Non assegnato"
                            )}

                        </td>

                        <td>

                            <strong>
                                ${
                                    squadra.numero_operai ||
                                    0
                                }
                            </strong>

                        </td>

                        <td>

                            <span
                                class="status ${classe}"
                            >

                                ${escapeHtml(
                                    squadra.stato ||
                                    "Attiva"
                                )}

                            </span>

                        </td>

                        <td>

                            <button
                                class="action-button people"
                                onclick="apriOperai(
                                    ${squadra.id}
                                )"
                            >
                                Operai
                            </button>

                            <button
                                class="action-button edit"
                                onclick="modificaSquadra(
                                    ${squadra.id}
                                )"
                            >
                                Modifica
                            </button>

                            <button
                                class="action-button delete"
                                onclick="eliminaSquadra(
                                    ${squadra.id}
                                )"
                            >
                                Elimina
                            </button>

                        </td>

                    `;


                    tbody.appendChild(
                        riga
                    );
                }
            );
        }


        aggiornaStatistiche();
    }


    function aggiornaStatistiche() {

        const totale =
            squadre.length;


        const attive =
            squadre.filter(
                squadra =>
                    squadra.stato ===
                    "Attiva"
            ).length;


        const assegnati =
            squadre.reduce(
                (
                    totale,
                    squadra
                ) =>
                    totale +
                    Number(
                        squadra.numero_operai ||
                        0
                    ),
                0
            );


        document
            .getElementById(
                "totaleSquadre"
            )
            .textContent =
            totale;


        document
            .getElementById(
                "squadreAttive"
            )
            .textContent =
            attive;


        document
            .getElementById(
                "totaleAssegnati"
            )
            .textContent =
            assegnati;
    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    window.addEventListener(
        "click",
        function(event) {

            const modalSquadra =
                document.getElementById(
                    "modalSquadra"
                );


            const modalOperai =
                document.getElementById(
                    "modalOperai"
                );


            if (
                event.target ===
                modalSquadra
            ) {

                chiudiModal();
            }


            if (
                event.target ===
                modalOperai
            ) {

                chiudiOperai();
            }

        }
    );


    caricaDati();

</script>

</body>
</html>
