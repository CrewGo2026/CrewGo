<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewGo - Accesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #172033;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">CrewGo</div>

    <div class="subtitle">
        Accedi alla tua piattaforma
    </div>

    <form>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="La tua email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="La tua password"
            required
        >

        <button type="submit">
            ACCEDI
        </button>
    </form>

    <div class="info">
        Gestione intelligente del lavoro
    </div>

</div>

</body>
</html>
