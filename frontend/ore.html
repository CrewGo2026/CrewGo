<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewGo - Ore Lavorate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .filters {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .hours {
            font-weight: bold;
        }

        .overtime {
            font-weight: bold;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty,
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div id="errore" class="error"></div>


    <div class="top">

        <div>
            <h1>Ore lavorate</h1>

            <div class="subtitle">
                Registra ore ordinarie, straordinari, operai, squadre e cantieri.
            </div>
        </div>

        <button
            class="add-button"
            onclick="apriNuovaOra()"
        >
            + REGISTRA ORE
        </button>

    </div>


    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totaleRegistrazioni"
            >
                0
            </div>

            <div class="stat-label">
                Registrazioni
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totaleOrdinarie"
            >
                0
            </div>

            <div class="stat-label">
                Ore ordinarie
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totaleStraordinarie"
            >
                0
            </div>

            <div class="stat-label">
                Straordinari
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="totaleComplessive"
            >
                0
            </div>

            <div class="stat-label">
                Ore complessive
            </div>

        </div>

    </div>


    <div class="filters">

        <input
            id="ricerca"
            type="text"
            placeholder="🔍 Cerca operaio, squadra o cantiere..."
            oninput="mostraOre()"
        >

        <input
            id="filtroData"
            type="date"
            onchange="mostraOre()"
            title="Filtra per giorno"
        >

        <input
            id="filtroMese"
            type="month"
            onchange="mostraOre()"
            title="Filtra per mese"
        >

        <select
            id="filtroOperaio"
            onchange="mostraOre()"
        >
            <option value="">Tutti gli operai</option>
        </select>

        <select
            id="filtroSquadra"
            onchange="mostraOre()"
        >
            <option value="">Tutte le squadre</option>
        </select>

        <select
            id="filtroCantiere"
            onchange="mostraOre()"
        >
            <option value="">Tutti i cantieri</option>
        </select>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Data</th>
                    <th>Operaio</th>
                    <th>Squadra</th>
                    <th>Cantiere</th>
                    <th>Ordinarie</th>
                    <th>Straordinari</th>
                    <th>Totale</th>
                    <th>Azioni</th>

                </tr>

            </thead>


            <tbody id="tabellaOre">

                <tr>

                    <td colspan="8">

                        <div class="loading">
                            Caricamento ore...
                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- =====================================================
     MODALE ORE
===================================================== -->

<div
    class="modal"
    id="modalOre"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Registra ore
            </h2>

            <button
                class="close"
                onclick="chiudiModal()"
            >
                ×
            </button>

        </div>


        <form id="formOre">

            <input
                type="hidden"
                id="oreId"
            >


            <div class="form-grid">

                <div class="form-group">

                    <label for="data">
                        Data *
                    </label>

                    <input
                        id="data"
                        type="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="operaio">
                        Operaio *
                    </label>

                    <select
                        id="operaio"
                        required
                    >

                        <option value="">
                            Seleziona operaio
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="squadra">
                        Squadra
                    </label>

                    <select id="squadra">

                        <option value="">
                            Nessuna squadra
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="cantiere">
                        Cantiere *
                    </label>

                    <select
                        id="cantiere"
                        required
                    >

                        <option value="">
                            Seleziona cantiere
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="oreOrdinarie">
                        Ore ordinarie
                    </label>

                    <input
                        id="oreOrdinarie"
                        type="number"
                        min="0"
                        step="0.5"
                        value="0"
                    >

                </div>


                <div class="form-group">

                    <label for="oreStraordinarie">
                        Ore straordinarie
                    </label>

                    <input
                        id="oreStraordinarie"
                        type="number"
                        min="0"
                        step="0.5"
                        value="0"
                    >

                </div>


                <div class="form-group full">

                    <label for="note">
                        Note
                    </label>

                    <textarea
                        id="note"
                        placeholder="Eventuali note..."
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA ORE
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let registrazioni = [];

    let operai = [];

    let squadre = [];

    let cantieri = [];

    let registrazioniFiltrate = [];


    function mostraErrore(messaggio) {

        const box =
            document.getElementById("errore");

        box.textContent =
            messaggio;

        box.style.display =
            "block";

    }


    function nascondiErrore() {

        document
            .getElementById("errore")
            .style.display =
            "none";

    }


    async function caricaTutto() {

        try {

            nascondiErrore();


            const datiRisposta =
                await fetch(
                    "/api/dati-collegamento"
                );


            if (!datiRisposta.ok) {

                throw new Error(
                    "Impossibile caricare operai, squadre e cantieri."
                );

            }


            const dati =
                await datiRisposta.json();


            operai =
                dati.operai || [];


            cantieri =
                dati.cantieri || [];


            squadre =
                dati.squadre || [];


            riempiSelect();


            await caricaOre();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    async function caricaOre() {

        const risposta =
            await fetch(
                "/api/ore"
            );


        if (!risposta.ok) {

            const risultato =
                await risposta.json()
                .catch(() => ({}));


            throw new Error(
                risultato.errore ||
                "Impossibile caricare le ore."
            );

        }


        registrazioni =
            await risposta.json();


        mostraOre();

    }


    function riempiSelect() {

        const operaioSelect =
            document.getElementById(
                "operaio"
            );


        const squadraSelect =
            document.getElementById(
                "squadra"
            );


        const cantiereSelect =
            document.getElementById(
                "cantiere"
            );


        const filtroOperaio =
            document.getElementById(
                "filtroOperaio"
            );

        const filtroSquadra =
            document.getElementById(
                "filtroSquadra"
            );

        const filtroCantiere =
            document.getElementById(
                "filtroCantiere"
            );


        operaioSelect.innerHTML = `
            <option value="">
                Seleziona operaio
            </option>
        `;


        squadraSelect.innerHTML = `
            <option value="">
                Nessuna squadra
            </option>
        `;


        cantiereSelect.innerHTML = `
            <option value="">
                Seleziona cantiere
            </option>
        `;


        filtroOperaio.innerHTML = `
            <option value="">
                Tutti gli operai
            </option>
        `;

        filtroSquadra.innerHTML = `
            <option value="">
                Tutte le squadre
            </option>
        `;

        filtroCantiere.innerHTML = `
            <option value="">
                Tutti i cantieri
            </option>
        `;


        operai
            .filter(
                operaio =>
                    operaio.stato === "Attivo"
            )
            .forEach(operaio => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    operaio.id;


                option.textContent =
                    operaio.nome +
                    " " +
                    operaio.cognome;


                operaioSelect.appendChild(
                    option
                );

            });


        operai
            .filter(
                operaio =>
                    operaio.stato === "Attivo"
            )
            .forEach(operaio => {
                const option =
                    document.createElement("option");

                option.value = operaio.id;

                option.textContent =
                    operaio.nome +
                    " " +
                    operaio.cognome;

                filtroOperaio.appendChild(option);
            });

        squadre
            .filter(
                squadra =>
                    squadra.stato === "Attiva"
            )
            .forEach(squadra => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    squadra.id;


                option.textContent =
                    squadra.nome;


                squadraSelect.appendChild(
                    option
                );

            });


        squadre
            .filter(
                squadra =>
                    squadra.stato === "Attiva"
            )
            .forEach(squadra => {
                const option =
                    document.createElement("option");

                option.value = squadra.id;
                option.textContent = squadra.nome;

                filtroSquadra.appendChild(option);
            });

        cantieri
            .filter(
                cantiere =>
                    cantiere.stato === "Attivo"
            )
            .forEach(cantiere => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    cantiere.id;


                option.textContent =
                    cantiere.nome +
                    " — " +
                    cantiere.citta;


                cantiereSelect.appendChild(
                    option
                );


                const filtroOption =
                    document.createElement(
                        "option"
                    );


                filtroOption.value =
                    cantiere.id;


                filtroOption.textContent =
                    cantiere.nome;


                filtroCantiere.appendChild(
                    filtroOption
                );

            });

    }


    function apriNuovaOra() {

        document
            .getElementById("formOre")
            .reset();


        document
            .getElementById("oreId")
            .value =
            "";


        document
            .getElementById("oreOrdinarie")
            .value =
            "0";


        document
            .getElementById("oreStraordinarie")
            .value =
            "0";


        document
            .getElementById("data")
            .value =
            oggi();


        document
            .getElementById("titoloModal")
            .textContent =
            "Registra ore";


        document
            .getElementById("modalOre")
            .classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalOre")
            .classList.remove("show");

    }


    document
        .getElementById("formOre")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                nascondiErrore();


                const id =
                    document
                        .getElementById("oreId")
                        .value;


                const dati = {

                    data:
                        document
                            .getElementById("data")
                            .value,

                    operaio_id:
                        Number(
                            document
                                .getElementById("operaio")
                                .value
                        ),

                    squadra_id:
                        document
                            .getElementById("squadra")
                            .value
                            ? Number(
                                document
                                    .getElementById("squadra")
                                    .value
                              )
                            : null,

                    cantiere_id:
                        Number(
                            document
                                .getElementById("cantiere")
                                .value
                        ),

                    ore_ordinarie:
                        Number(
                            document
                                .getElementById("oreOrdinarie")
                                .value
                        ),

                    ore_straordinarie:
                        Number(
                            document
                                .getElementById("oreStraordinarie")
                                .value
                        ),

                    note:
                        document
                            .getElementById("note")
                            .value
                            .trim()

                };


                if (
                    !dati.operaio_id ||
                    !dati.cantiere_id
                ) {

                    mostraErrore(
                        "Seleziona operaio e cantiere."
                    );

                    return;

                }


                try {

                    let risposta;


                    if (id) {

                        risposta =
                            await fetch(
                                `/api/ore/${id}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    } else {

                        risposta =
                            await fetch(
                                "/api/ore",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    }


                    const risultato =
                        await risposta.json();


                    if (!risposta.ok) {

                        throw new Error(
                            risultato.errore ||
                            "Errore durante il salvataggio delle ore."
                        );

                    }


                    chiudiModal();

                    await caricaTutto();

                } catch (errore) {

                    mostraErrore(
                        errore.message
                    );

                }

            }
        );


    function modificaOre(id) {

        const record =
            registrazioni.find(
                item =>
                    item.id === id
            );


        if (!record) {
            return;
        }


        document
            .getElementById("oreId")
            .value =
            record.id;


        document
            .getElementById("data")
            .value =
            record.data || "";


        document
            .getElementById("operaio")
            .value =
            record.operaio_id || "";


        document
            .getElementById("squadra")
            .value =
            record.squadra_id || "";


        document
            .getElementById("cantiere")
            .value =
            record.cantiere_id || "";


        document
            .getElementById("oreOrdinarie")
            .value =
            record.ore_ordinarie || 0;


        document
            .getElementById("oreStraordinarie")
            .value =
            record.ore_straordinarie || 0;


        document
            .getElementById("note")
            .value =
            record.note || "";


        document
            .getElementById("titoloModal")
            .textContent =
            "Modifica ore";


        document
            .getElementById("modalOre")
            .classList.add("show");

    }


    async function eliminaOre(id) {

        if (!confirm(
            "Sei sicuro di voler eliminare questa registrazione?"
        )) {
            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/ore/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante l'eliminazione."
                );

            }


            await caricaTutto();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    function mostraOre() {

        const tbody =
            document.getElementById("tabellaOre");

        const ricerca =
            document.getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();

        const filtroData =
            document.getElementById("filtroData").value;

        const filtroMese =
            document.getElementById("filtroMese").value;

        const filtroOperaio =
            document.getElementById("filtroOperaio").value;

        const filtroSquadra =
            document.getElementById("filtroSquadra").value;

        const filtroCantiere =
            document.getElementById("filtroCantiere").value;

        registrazioniFiltrate =
            registrazioni.filter(record => {

                const testo = (
                    (record.operaio_nome || "") + " " +
                    (record.operaio_cognome || "") + " " +
                    (record.squadra_nome || "") + " " +
                    (record.cantiere_nome || "")
                ).toLowerCase();

                const ricercaOK =
                    testo.includes(ricerca);

                const dataOK =
                    !filtroData ||
                    record.data === filtroData;

                const meseOK =
                    !filtroMese ||
                    String(record.data || "")
                        .startsWith(filtroMese);

                const operaioOK =
                    !filtroOperaio ||
                    String(record.operaio_id) ===
                    String(filtroOperaio);

                const squadraOK =
                    !filtroSquadra ||
                    String(record.squadra_id) ===
                    String(filtroSquadra);

                const cantiereOK =
                    !filtroCantiere ||
                    String(record.cantiere_id) ===
                    String(filtroCantiere);

                return (
                    ricercaOK &&
                    dataOK &&
                    meseOK &&
                    operaioOK &&
                    squadraOK &&
                    cantiereOK
                );
            });

        tbody.innerHTML = "";

        if (registrazioniFiltrate.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            ${
                                registrazioni.length === 0
                                ? "Nessuna registrazione presente nel database."
                                : "Nessun risultato trovato con i filtri selezionati."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            registrazioniFiltrate.forEach(record => {

                const riga =
                    document.createElement("tr");

                const ordinarie =
                    Number(record.ore_ordinarie || 0);

                const straordinarie =
                    Number(record.ore_straordinarie || 0);

                const totale =
                    ordinarie + straordinarie;

                riga.innerHTML = `
                    <td>${formattaData(record.data)}</td>

                    <td class="name">
                        ${escapeHtml(record.operaio_nome || "")}
                        ${escapeHtml(record.operaio_cognome || "")}
                    </td>

                    <td>
                        ${escapeHtml(record.squadra_nome || "—")}
                    </td>

                    <td>
                        ${escapeHtml(record.cantiere_nome || "—")}
                    </td>

                    <td class="hours">
                        ${formattaOre(ordinarie)} h
                    </td>

                    <td class="overtime">
                        ${formattaOre(straordinarie)} h
                    </td>

                    <td class="hours">
                        ${formattaOre(totale)} h
                    </td>

                    <td>
                        <button
                            class="action-button edit"
                            onclick="modificaOre(${record.id})"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaOre(${record.id})"
                        >
                            Elimina
                        </button>
                    </td>
                `;

                tbody.appendChild(riga);
            });
        }

        aggiornaStatistiche();
    }


    function aggiornaStatistiche() {

        const totale =
            registrazioniFiltrate.length;

        const ordinarie =
            registrazioniFiltrate.reduce(
                (somma, record) =>
                    somma +
                    Number(record.ore_ordinarie || 0),
                0
            );

        const straordinarie =
            registrazioniFiltrate.reduce(
                (somma, record) =>
                    somma +
                    Number(record.ore_straordinarie || 0),
                0
            );

        const complessive =
            ordinarie + straordinarie;

        document
            .getElementById("totaleRegistrazioni")
            .textContent = totale;

        document
            .getElementById("totaleOrdinarie")
            .textContent =
            formattaOre(ordinarie);

        document
            .getElementById("totaleStraordinarie")
            .textContent =
            formattaOre(straordinarie);

        document
            .getElementById("totaleComplessive")
            .textContent =
            formattaOre(complessive);
    }


    function formattaOre(valore) {

        const numero =
            Number(valore || 0);


        if (
            Number.isInteger(
                numero
            )
        ) {

            return String(
                numero
            );

        }


        return numero
            .toFixed(2)
            .replace(".", ",");

    }


    function formattaData(data) {

        if (!data) {
            return "—";
        }


        const parti =
            data.split("-");


        if (parti.length !== 3) {
            return data;
        }


        return (
            parti[2] +
            "/" +
            parti[1] +
            "/" +
            parti[0]
        );

    }


    function oggi() {

        const data =
            new Date();


        const anno =
            data.getFullYear();


        const mese =
            String(
                data.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const giorno =
            String(
                data.getDate()
            ).padStart(
                2,
                "0"
            );


        return (
            anno +
            "-" +
            mese +
            "-" +
            giorno
        );

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById(
                    "modalOre"
                );


            if (
                event.target === modal
            ) {

                chiudiModal();

            }

        }
    );


    caricaTutto();

</script>
