<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrewGo - Ore lavorate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1300px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1150px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .overtime {
            color: #b45309;
            font-weight: bold;
        }

        .normal {
            color: #166534;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .ok {
            background: #dcfce7;
            color: #166534;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div class="top">

        <div>
            <h1>Ore lavorate</h1>

            <div class="subtitle">
                Registra e controlla le ore giornaliere del personale.
            </div>
        </div>

        <button class="add-button" onclick="apriNuovaOra()">
            + INSERISCI ORE
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleRegistrazioni">
                0
            </div>

            <div class="stat-label">
                Registrazioni
            </div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totaleOre">
                0
            </div>

            <div class="stat-label">
                Ore totali
            </div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totaleStraordinari">
                0
            </div>

            <div class="stat-label">
                Ore straordinarie
            </div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totaleAnomalie">
                0
            </div>

            <div class="stat-label">
                Anomalie
            </div>
        </div>

    </div>


    <div class="filters">

        <input
            id="ricerca"
            type="text"
            placeholder="🔍 Cerca operaio, squadra o cantiere..."
            oninput="mostraOre()"
        >

        <input
            id="filtroData"
            type="date"
            onchange="mostraOre()"
        >

        <select
            id="filtroStato"
            onchange="mostraOre()"
        >
            <option value="">
                Tutti gli stati
            </option>

            <option value="Regolare">
                Regolari
            </option>

            <option value="Straordinario">
                Straordinari
            </option>
        </select>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Data</th>
                    <th>Operaio</th>
                    <th>Squadra</th>
                    <th>Cantiere</th>
                    <th>Ordinarie</th>
                    <th>Straordinarie</th>
                    <th>Totale</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody id="tabellaOre">
            </tbody>

        </table>

    </div>

</main>


<div class="modal" id="modalOre">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Inserisci ore
            </h2>

            <button class="close" onclick="chiudiModal()">
                ×
            </button>

        </div>


        <form id="formOre">

            <input type="hidden" id="oraId">


            <div class="form-grid">

                <div class="form-group">

                    <label for="data">
                        Data
                    </label>

                    <input
                        id="data"
                        type="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="operaio">
                        Operaio
                    </label>

                    <input
                        id="operaio"
                        type="text"
                        placeholder="Nome e cognome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="squadra">
                        Squadra
                    </label>

                    <input
                        id="squadra"
                        type="text"
                        placeholder="Es. Squadra Milano"
                    >

                </div>


                <div class="form-group">

                    <label for="cantiere">
                        Cantiere
                    </label>

                    <input
                        id="cantiere"
                        type="text"
                        placeholder="Es. Fiera Milano"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ordinarie">
                        Ore ordinarie
                    </label>

                    <input
                        id="ordinarie"
                        type="number"
                        min="0"
                        max="24"
                        step="0.5"
                        value="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="straordinarie">
                        Ore straordinarie
                    </label>

                    <input
                        id="straordinarie"
                        type="number"
                        min="0"
                        max="24"
                        step="0.5"
                        value="0"
                    >

                </div>


                <div class="form-group full">

                    <label for="note">
                        Note
                    </label>

                    <input
                        id="note"
                        type="text"
                        placeholder="Eventuali note..."
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA ORE
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let registrazioni = JSON.parse(
        localStorage.getItem("crewgo_ore") || "[]"
    );


    function generaId() {
        return Date.now().toString();
    }


    function salvaDati() {

        localStorage.setItem(
            "crewgo_ore",
            JSON.stringify(registrazioni)
        );

    }


    function apriNuovaOra() {

        document
            .getElementById("formOre")
            .reset();

        document
            .getElementById("oraId")
            .value = "";

        document
            .getElementById("data")
            .value = new Date()
            .toISOString()
            .split("T")[0];

        document
            .getElementById("ordinarie")
            .value = "8";

        document
            .getElementById("straordinarie")
            .value = "0";

        document
            .getElementById("titoloModal")
            .textContent = "Inserisci ore";

        document
            .getElementById("modalOre")
            .classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalOre")
            .classList.remove("show");

    }


    document
        .getElementById("formOre")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const id =
                document.getElementById("oraId").value;


            const ordinarie =
                Number(
                    document.getElementById("ordinarie").value
                ) || 0;


            const straordinarie =
                Number(
                    document.getElementById("straordinarie").value
                ) || 0;


            const registrazione = {

                id: id || generaId(),

                data:
                    document.getElementById("data").value,

                operaio:
                    document.getElementById("operaio").value.trim(),

                squadra:
                    document.getElementById("squadra").value.trim(),

                cantiere:
                    document.getElementById("cantiere").value.trim(),

                ordinarie: ordinarie,

                straordinarie: straordinarie,

                totale:
                    ordinarie + straordinarie,

                note:
                    document.getElementById("note").value.trim()

            };


            if (id) {

                const indice =
                    registrazioni.findIndex(
                        item => item.id === id
                    );

                if (indice !== -1) {
                    registrazioni[indice] = registrazione;
                }

            } else {

                registrazioni.push(registrazione);

            }


            salvaDati();

            mostraOre();

            chiudiModal();

        });


    function modificaOre(id) {

        const item =
            registrazioni.find(
                record => record.id === id
            );


        if (!item) {
            return;
        }


        document.getElementById("oraId").value =
            item.id;

        document.getElementById("data").value =
            item.data;

        document.getElementById("operaio").value =
            item.operaio;

        document.getElementById("squadra").value =
            item.squadra;

        document.getElementById("cantiere").value =
            item.cantiere;

        document.getElementById("ordinarie").value =
            item.ordinarie;

        document.getElementById("straordinarie").value =
            item.straordinarie;

        document.getElementById("note").value =
            item.note;


        document.getElementById("titoloModal")
            .textContent = "Modifica registrazione";


        document
            .getElementById("modalOre")
            .classList.add("show");

    }


    function eliminaOre(id) {

        if (!confirm(
            "Sei sicuro di voler eliminare questa registrazione?"
        )) {
            return;
        }


        registrazioni =
            registrazioni.filter(
                item => item.id !== id
            );


        salvaDati();

        mostraOre();

    }


    function mostraOre() {

        const tbody =
            document.getElementById("tabellaOre");

        const ricerca =
            document
                .getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();

        const filtroData =
            document
                .getElementById("filtroData")
                .value;

        const filtroStato =
            document
                .getElementById("filtroStato")
                .value;


        const filtrate =
            registrazioni.filter(item => {

                const testo = (

                    item.operaio + " " +
                    item.squadra + " " +
                    item.cantiere

                ).toLowerCase();


                const ricercaOK =
                    testo.includes(ricerca);


                const dataOK =
                    !filtroData ||
                    item.data === filtroData;


                const stato =
                    item.straordinarie > 0
                    ? "Straordinario"
                    : "Regolare";


                const statoOK =
                    !filtroStato ||
                    stato === filtroStato;


                return ricercaOK &&
                       dataOK &&
                       statoOK;

            });


        tbody.innerHTML = "";


        if (filtrate.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="9">
                        <div class="empty">
                            ${
                                registrazioni.length === 0
                                ? "Nessuna registrazione di ore."
                                : "Nessun risultato trovato."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            filtrate.forEach(item => {

                const riga =
                    document.createElement("tr");


                const straordinario =
                    item.straordinarie > 0;


                const classe =
                    straordinario
                    ? "warning"
                    : "ok";


                const stato =
                    straordinario
                    ? "Straordinario"
                    : "Regolare";


                riga.innerHTML = `

                    <td>
                        ${formattaData(item.data)}
                    </td>

                    <td class="name">
                        ${escapeHtml(item.operaio)}
                    </td>

                    <td>
                        ${escapeHtml(item.squadra || "—")}
                    </td>

                    <td>
                        ${escapeHtml(item.cantiere)}
                    </td>

                    <td class="normal">
                        ${item.ordinarie.toFixed(1)} h
                    </td>

                    <td class="overtime">
                        ${item.straordinarie.toFixed(1)} h
                    </td>

                    <td>
                        <strong>
                            ${item.totale.toFixed(1)} h
                        </strong>
                    </td>

                    <td>
                        <span class="status ${classe}">
                            ${stato}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-button edit"
                            onclick="modificaOre('${item.id}')"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaOre('${item.id}')"
                        >
                            Elimina
                        </button>

                    </td>

                `;


                tbody.appendChild(riga);

            });

        }


        aggiornaStatistiche();

    }


    function aggiornaStatistiche() {

        const totaleRegistrazioni =
            registrazioni.length;


        const totaleOre =
            registrazioni.reduce(
                (somma, item) =>
                    somma + item.totale,
                0
            );


        const totaleStraordinari =
            registrazioni.reduce(
                (somma, item) =>
                    somma + item.straordinarie,
                0
            );


        const totaleAnomalie =
            registrazioni.filter(
                item => item.totale > 10
            ).length;


        document.getElementById("totaleRegistrazioni")
            .textContent = totaleRegistrazioni;

        document.getElementById("totaleOre")
            .textContent = totaleOre.toFixed(1);

        document.getElementById("totaleStraordinari")
            .textContent = totaleStraordinari.toFixed(1);

        document.getElementById("totaleAnomalie")
            .textContent = totaleAnomalie;

    }


    function formattaData(data) {

        if (!data) {
            return "—";
        }

        const parti = data.split("-");

        if (parti.length !== 3) {
            return data;
        }

        return parti[2] + "/" +
               parti[1] + "/" +
               parti[0];

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById("modalOre");

            if (event.target === modal) {
                chiudiModal();
            }

        }
    );


    mostraOre();

</script>

</body>
</html>
