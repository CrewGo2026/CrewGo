<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrewGo - Cantieri</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1300px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .filters input,
        .filters select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            font-size: 15px;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .closed {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty,
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div id="errore" class="error"></div>


    <div class="top">

        <div>
            <h1>Cantieri</h1>

            <div class="subtitle">
                Gestisci cantieri, clienti, indirizzi, date e stato.
            </div>
        </div>

        <button class="add-button" onclick="apriNuovoCantiere()">
            + AGGIUNGI CANTIERE
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleCantieri">
                0
            </div>

            <div class="stat-label">
                Totale cantieri
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="cantieriAttivi">
                0
            </div>

            <div class="stat-label">
                Cantieri attivi
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="cantieriChiusi">
                0
            </div>

            <div class="stat-label">
                Cantieri non attivi
            </div>
        </div>

    </div>


    <div class="filters">

        <input
            id="ricerca"
            type="text"
            placeholder="🔍 Cerca cantiere, cliente, città..."
            oninput="mostraCantieri()"
        >

        <select
            id="filtroStato"
            onchange="mostraCantieri()"
        >
            <option value="">
                Tutti gli stati
            </option>

            <option value="Attivo">
                Attivi
            </option>

            <option value="Non attivo">
                Non attivi
            </option>

        </select>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Cantiere</th>
                    <th>Cliente</th>
                    <th>Località</th>
                    <th>Indirizzo</th>
                    <th>Periodo</th>
                    <th>Caposquadra</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody id="tabellaCantieri">

                <tr>
                    <td colspan="8">
                        <div class="loading">
                            Caricamento cantieri...
                        </div>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<div class="modal" id="modalCantiere">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Aggiungi cantiere
            </h2>

            <button
                class="close"
                onclick="chiudiModal()"
            >
                ×
            </button>

        </div>


        <form id="formCantiere">

            <input
                type="hidden"
                id="cantiereId"
            >


            <div class="form-grid">

                <div class="form-group">

                    <label for="nome">
                        Nome cantiere *
                    </label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Es. Fiera Milano"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="cliente">
                        Cliente *
                    </label>

                    <input
                        id="cliente"
                        type="text"
                        placeholder="Nome cliente"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="citta">
                        Città *
                    </label>

                    <input
                        id="citta"
                        type="text"
                        placeholder="Es. Milano"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="indirizzo">
                        Indirizzo
                    </label>

                    <input
                        id="indirizzo"
                        type="text"
                        placeholder="Via, numero civico"
                    >

                </div>


                <div class="form-group">

                    <label for="dataInizio">
                        Data inizio
                    </label>

                    <input
                        id="dataInizio"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="dataFine">
                        Data fine
                    </label>

                    <input
                        id="dataFine"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="caposquadra">
                        Caposquadra
                    </label>

                    <input
                        id="caposquadra"
                        type="text"
                        placeholder="Nome caposquadra"
                    >

                </div>


                <div class="form-group">

                    <label for="stato">
                        Stato
                    </label>

                    <select id="stato">

                        <option value="Attivo">
                            Attivo
                        </option>

                        <option value="Non attivo">
                            Non attivo
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA CANTIERE
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let cantieri = [];


    function mostraErrore(messaggio) {

        const box =
            document.getElementById("errore");

        box.textContent = messaggio;

        box.style.display = "block";

    }


    function nascondiErrore() {

        document
            .getElementById("errore")
            .style.display = "none";

    }


    async function caricaCantieri() {

        try {

            nascondiErrore();

            const risposta =
                await fetch("/api/cantieri");


            if (!risposta.ok) {

                throw new Error(
                    "Impossibile caricare i cantieri."
                );

            }


            cantieri =
                await risposta.json();


            mostraCantieri();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    function apriNuovoCantiere() {

        document
            .getElementById("formCantiere")
            .reset();

        document
            .getElementById("cantiereId")
            .value = "";

        document
            .getElementById("titoloModal")
            .textContent =
            "Aggiungi cantiere";

        document
            .getElementById("modalCantiere")
            .classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalCantiere")
            .classList.remove("show");

    }


    document
        .getElementById("formCantiere")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                nascondiErrore();


                const id =
                    document
                        .getElementById("cantiereId")
                        .value;


                const dati = {

                    nome:
                        document
                            .getElementById("nome")
                            .value
                            .trim(),

                    cliente:
                        document
                            .getElementById("cliente")
                            .value
                            .trim(),

                    citta:
                        document
                            .getElementById("citta")
                            .value
                            .trim(),

                    indirizzo:
                        document
                            .getElementById("indirizzo")
                            .value
                            .trim(),

                    data_inizio:
                        document
                            .getElementById("dataInizio")
                            .value,

                    data_fine:
                        document
                            .getElementById("dataFine")
                            .value,

                    caposquadra:
                        document
                            .getElementById("caposquadra")
                            .value
                            .trim(),

                    stato:
                        document
                            .getElementById("stato")
                            .value

                };


                try {

                    let risposta;


                    if (id) {

                        risposta =
                            await fetch(
                                `/api/cantieri/${id}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    } else {

                        risposta =
                            await fetch(
                                "/api/cantieri",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    }


                    const risultato =
                        await risposta.json();


                    if (!risposta.ok) {

                        throw new Error(
                            risultato.errore ||
                            "Errore durante il salvataggio."
                        );

                    }


                    chiudiModal();

                    await caricaCantieri();

                } catch (errore) {

                    mostraErrore(
                        errore.message
                    );

                }

            }
        );


    function modificaCantiere(id) {

        const cantiere =
            cantieri.find(
                item =>
                    item.id === id
            );


        if (!cantiere) {
            return;
        }


        document
            .getElementById("cantiereId")
            .value =
            cantiere.id;


        document
            .getElementById("nome")
            .value =
            cantiere.nome || "";


        document
            .getElementById("cliente")
            .value =
            cantiere.cliente || "";


        document
            .getElementById("citta")
            .value =
            cantiere.citta || "";


        document
            .getElementById("indirizzo")
            .value =
            cantiere.indirizzo || "";


        document
            .getElementById("dataInizio")
            .value =
            cantiere.data_inizio || "";


        document
            .getElementById("dataFine")
            .value =
            cantiere.data_fine || "";


        document
            .getElementById("caposquadra")
            .value =
            cantiere.caposquadra || "";


        document
            .getElementById("stato")
            .value =
            cantiere.stato || "Attivo";


        document
            .getElementById("titoloModal")
            .textContent =
            "Modifica cantiere";


        document
            .getElementById("modalCantiere")
            .classList.add("show");

    }


    async function eliminaCantiere(id) {

        if (!confirm(
            "Sei sicuro di voler eliminare questo cantiere?"
        )) {
            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/cantieri/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante l'eliminazione."
                );

            }


            await caricaCantieri();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    function mostraCantieri() {

        const tbody =
            document
                .getElementById("tabellaCantieri");


        const ricerca =
            document
                .getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();


        const filtroStato =
            document
                .getElementById("filtroStato")
                .value;


        const filtrati =
            cantieri.filter(cantiere => {

                const testo = (

                    cantiere.nome + " " +
                    cantiere.cliente + " " +
                    cantiere.citta + " " +
                    (cantiere.indirizzo || "") + " " +
                    (cantiere.caposquadra || "")

                ).toLowerCase();


                const ricercaOK =
                    testo.includes(ricerca);


                const statoOK =
                    !filtroStato ||
                    cantiere.stato === filtroStato;


                return ricercaOK &&
                       statoOK;

            });


        tbody.innerHTML = "";


        if (filtrati.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            ${
                                cantieri.length === 0
                                ? "Nessun cantiere presente nel database."
                                : "Nessun risultato trovato."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            filtrati.forEach(cantiere => {

                const riga =
                    document.createElement("tr");


                const classeStato =
                    cantiere.stato === "Attivo"
                    ? "active"
                    : "closed";


                riga.innerHTML = `

                    <td class="name">
                        ${escapeHtml(
                            cantiere.nome
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            cantiere.cliente
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            cantiere.citta
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            cantiere.indirizzo || "—"
                        )}
                    </td>

                    <td>
                        ${formattaData(
                            cantiere.data_inizio
                        )}
                        →
                        ${formattaData(
                            cantiere.data_fine
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            cantiere.caposquadra || "—"
                        )}
                    </td>

                    <td>
                        <span
                            class="status ${classeStato}"
                        >
                            ${escapeHtml(
                                cantiere.stato || "Attivo"
                            )}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-button edit"
                            onclick="modificaCantiere(${cantiere.id})"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaCantiere(${cantiere.id})"
                        >
                            Elimina
                        </button>

                    </td>

                `;


                tbody.appendChild(riga);

            });

        }


        aggiornaStatistiche();

    }


    function aggiornaStatistiche() {

        const totale =
            cantieri.length;


        const attivi =
            cantieri.filter(
                cantiere =>
                    cantiere.stato === "Attivo"
            ).length;


        const nonAttivi =
            cantieri.filter(
                cantiere =>
                    cantiere.stato !== "Attivo"
            ).length;


        document
            .getElementById("totaleCantieri")
            .textContent =
            totale;


        document
            .getElementById("cantieriAttivi")
            .textContent =
            attivi;


        document
            .getElementById("cantieriChiusi")
            .textContent =
            nonAttivi;

    }


    function formattaData(data) {

        if (!data) {
            return "—";
        }


        const parti =
            data.split("-");


        if (parti.length !== 3) {
            return data;
        }


        return (
            parti[2] +
            "/" +
            parti[1] +
            "/" +
            parti[0]
        );

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById(
                    "modalCantiere"
                );


            if (event.target === modal) {
                chiudiModal();
            }

        }
    );


    caricaCantieri();

</script>

</body>
</html>
