<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrewGo - Operai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="role">
        AREA TITOLARE
    </div>

</header>

<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>

    <div class="top">

        <div>
            <h1>Operai</h1>

            <div class="subtitle">
                Gestisci il personale della tua azienda.
            </div>
        </div>

        <button class="add-button">
            + AGGIUNGI OPERAIO
        </button>

    </div>

    <input
        class="search"
        type="text"
        placeholder="Cerca un operaio..."
    >

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Nome e Cognome</th>
                    <th>Ruolo</th>
                    <th>Squadra</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td class="name">Nessun operaio inserito</td>
                    <td>—</td>
                    <td>—</td>

                    <td>
                        <span class="status inactive">
                            —
                        </span>
                    </td>

                    <td>—</td>
                </tr>

            </tbody>

        </table>

        <div class="empty">
            Qui appariranno tutti gli operai della tua azienda.
        </div>

    </div>

</main>

</body>
</html>
