<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrewGo - Operai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            background: white;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .disable {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        /* MODALE */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div class="top">

        <div>
            <h1>Operai</h1>

            <div class="subtitle">
                Gestisci il personale della tua azienda.
            </div>
        </div>

        <button class="add-button" onclick="apriNuovoOperaio()">
            + AGGIUNGI OPERAIO
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleOperai">
                0
            </div>

            <div class="stat-label">
                Totale operai
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="operaiAttivi">
                0
            </div>

            <div class="stat-label">
                Operai attivi
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="operaiInattivi">
                0
            </div>

            <div class="stat-label">
                Operai non attivi
            </div>
        </div>

    </div>


    <input
        class="search"
        id="ricerca"
        type="text"
        placeholder="🔍 Cerca per nome, email, mansione o squadra..."
        oninput="mostraOperai()"
    >


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Nome e Cognome</th>
                    <th>Email</th>
                    <th>Telefono</th>
                    <th>Mansione</th>
                    <th>Squadra</th>
                    <th>Assunzione</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody id="tabellaOperai">
            </tbody>

        </table>

    </div>

</main>


<!-- MODALE AGGIUNTA / MODIFICA -->

<div class="modal" id="modalOperaio">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Aggiungi operaio
            </h2>

            <button class="close" onclick="chiudiModal()">
                ×
            </button>

        </div>


        <form id="formOperaio">

            <input type="hidden" id="operaioId">


            <div class="form-grid">

                <div class="form-group">
                    <label for="nome">
                        Nome
                    </label>

                    <input
                        id="nome"
                        type="text"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="cognome">
                        Cognome
                    </label>

                    <input
                        id="cognome"
                        type="text"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                    >
                </div>


                <div class="form-group">
                    <label for="telefono">
                        Telefono
                    </label>

                    <input
                        id="telefono"
                        type="tel"
                    >
                </div>


                <div class="form-group">
                    <label for="mansione">
                        Mansione
                    </label>

                    <select id="mansione">

                        <option value="">
                            Seleziona mansione
                        </option>

                        <option value="Montatore">
                            Montatore
                        </option>

                        <option value="Caposquadra">
                            Caposquadra
                        </option>

                        <option value="Saldatore">
                            Saldatore
                        </option>

                        <option value="Elettricista">
                            Elettricista
                        </option>

                        <option value="Carpentiere">
                            Carpentiere
                        </option>

                        <option value="Autista">
                            Autista
                        </option>

                        <option value="Altro">
                            Altro
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="squadra">
                        Squadra
                    </label>

                    <select id="squadra">

                        <option value="">
                            Nessuna squadra
                        </option>

                        <option value="Squadra 1">
                            Squadra 1
                        </option>

                        <option value="Squadra 2">
                            Squadra 2
                        </option>

                        <option value="Squadra 3">
                            Squadra 3
                        </option>

                        <option value="Squadra 4">
                            Squadra 4
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="assunzione">
                        Data di assunzione
                    </label>

                    <input
                        id="assunzione"
                        type="date"
                    >
                </div>


                <div class="form-group">
                    <label for="stato">
                        Stato
                    </label>

                    <select id="stato">

                        <option value="Attivo">
                            Attivo
                        </option>

                        <option value="Non attivo">
                            Non attivo
                        </option>

                    </select>
                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA OPERAIO
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let operai = JSON.parse(
        localStorage.getItem("crewgo_operai") || "[]"
    );


    function salvaDati() {

        localStorage.setItem(
            "crewgo_operai",
            JSON.stringify(operai)
        );

    }


    function apriNuovoOperaio() {

        document.getElementById("formOperaio").reset();

        document.getElementById("operaioId").value = "";

        document.getElementById("titoloModal").textContent =
            "Aggiungi operaio";

        document.getElementById("modalOperaio").classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalOperaio")
            .classList.remove("show");

    }


    function generaId() {

        return Date.now().toString();

    }


    document
        .getElementById("formOperaio")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const id =
                document.getElementById("operaioId").value;


            const operaio = {

                id: id || generaId(),

                nome:
                    document.getElementById("nome").value.trim(),

                cognome:
                    document.getElementById("cognome").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                telefono:
                    document.getElementById("telefono").value.trim(),

                mansione:
                    document.getElementById("mansione").value,

                squadra:
                    document.getElementById("squadra").value,

                assunzione:
                    document.getElementById("assunzione").value,

                stato:
                    document.getElementById("stato").value

            };


            if (id) {

                const indice =
                    operai.findIndex(
                        item => item.id === id
                    );

                if (indice !== -1) {

                    operai[indice] = operaio;

                }

            } else {

                operai.push(operaio);

            }


            salvaDati();

            mostraOperai();

            chiudiModal();

        });


    function modificaOperaio(id) {

        const operaio =
            operai.find(
                item => item.id === id
            );


        if (!operaio) {
            return;
        }


        document.getElementById("operaioId").value =
            operaio.id;

        document.getElementById("nome").value =
            operaio.nome;

        document.getElementById("cognome").value =
            operaio.cognome;

        document.getElementById("email").value =
            operaio.email;

        document.getElementById("telefono").value =
            operaio.telefono;

        document.getElementById("mansione").value =
            operaio.mansione;

        document.getElementById("squadra").value =
            operaio.squadra;

        document.getElementById("assunzione").value =
            operaio.assunzione;

        document.getElementById("stato").value =
            operaio.stato;


        document.getElementById("titoloModal").textContent =
            "Modifica operaio";

        document.getElementById("modalOperaio").classList.add("show");

    }


    function cambiaStato(id) {

        const operaio =
            operai.find(
                item => item.id === id
            );


        if (!operaio) {
            return;
        }


        if (operaio.stato === "Attivo") {

            operaio.stato = "Non attivo";

        } else {

            operaio.stato = "Attivo";

        }


        salvaDati();

        mostraOperai();

    }


    function eliminaOperaio(id) {

        const conferma =
            confirm(
                "Sei sicuro di voler eliminare questo operaio?"
            );


        if (!conferma) {
            return;
        }


        operai =
            operai.filter(
                item => item.id !== id
            );


        salvaDati();

        mostraOperai();

    }


    function mostraOperai() {

        const tbody =
            document.getElementById("tabellaOperai");

        const ricerca =
            document
                .getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();


        const filtrati =
            operai.filter(operaio => {

                const testo = (

                    operaio.nome + " " +
                    operaio.cognome + " " +
                    operaio.email + " " +
                    operaio.mansione + " " +
                    operaio.squadra

                ).toLowerCase();


                return testo.includes(ricerca);

            });


        tbody.innerHTML = "";


        if (filtrati.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            ${
                                operai.length === 0
                                ? "Nessun operaio inserito."
                                : "Nessun risultato trovato."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            filtrati.forEach(operaio => {

                const riga =
                    document.createElement("tr");


                const statoClasse =
                    operaio.stato === "Attivo"
                    ? "active"
                    : "inactive";


                riga.innerHTML = `

                    <td class="name">
                        ${escapeHtml(operaio.nome)}
                        ${escapeHtml(operaio.cognome)}
                    </td>

                    <td>
                        ${escapeHtml(operaio.email || "—")}
                    </td>

                    <td>
                        ${escapeHtml(operaio.telefono || "—")}
                    </td>

                    <td>
                        ${escapeHtml(operaio.mansione || "—")}
                    </td>

                    <td>
                        ${escapeHtml(operaio.squadra || "—")}
                    </td>

                    <td>
                        ${operaio.assunzione || "—"}
                    </td>

                    <td>
                        <span class="status ${statoClasse}">
                            ${escapeHtml(operaio.stato)}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-button edit"
                            onclick="modificaOperaio('${operaio.id}')"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button disable"
                            onclick="cambiaStato('${operaio.id}')"
                        >
                            ${
                                operaio.stato === "Attivo"
                                ? "Disattiva"
                                : "Attiva"
                            }
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaOperaio('${operaio.id}')"
                        >
                            Elimina
                        </button>

                    </td>

                `;


                tbody.appendChild(riga);

            });

        }


        aggiornaStatistiche();

    }


    function aggiornaStatistiche() {

        const totale =
            operai.length;


        const attivi =
            operai.filter(
                item => item.stato === "Attivo"
            ).length;


        const inattivi =
            operai.filter(
                item => item.stato === "Non attivo"
            ).length;


        document.getElementById("totaleOperai")
            .textContent = totale;

        document.getElementById("operaiAttivi")
            .textContent = attivi;

        document.getElementById("operaiInattivi")
            .textContent = inattivi;

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById("modalOperaio");


            if (event.target === modal) {

                chiudiModal();

            }

        }
    );


    mostraOperai();

</script>

</body>
</html>
