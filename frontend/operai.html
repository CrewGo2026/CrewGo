<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrewGo - Operai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .add-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            background: white;
        }

        .table-box {
            background: white;
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            color: #475569;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .name {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .edit {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .disable {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 18px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CrewGo
    </div>

    <div class="header-right">

        <div class="role">
            AREA TITOLARE
        </div>

        <a class="logout" href="/logout">
            Esci
        </a>

    </div>

</header>


<main>

    <a class="back" href="/dashboard">
        ← Torna alla Dashboard
    </a>


    <div id="errore" class="error"></div>


    <div class="top">

        <div>
            <h1>Operai</h1>

            <div class="subtitle">
                Gestisci dipendenti, mansioni, contatti e stato lavorativo.
            </div>
        </div>

        <button class="add-button" onclick="apriNuovoOperaio()">
            + AGGIUNGI OPERAIO
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="totaleOperai">
                0
            </div>

            <div class="stat-label">
                Totale operai
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="operaiAttivi">
                0
            </div>

            <div class="stat-label">
                Operai attivi
            </div>
        </div>


        <div class="stat">
            <div class="stat-number" id="operaiNonAttivi">
                0
            </div>

            <div class="stat-label">
                Non attivi
            </div>
        </div>

    </div>


    <input
        class="search"
        id="ricerca"
        type="text"
        placeholder="🔍 Cerca nome, cognome, mansione, telefono..."
        oninput="mostraOperai()"
    >


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Contatti</th>
                    <th>Mansione</th>
                    <th>Squadra</th>
                    <th>Assunzione</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>

            </thead>

            <tbody id="tabellaOperai">

                <tr>
                    <td colspan="7">
                        <div class="loading">
                            Caricamento operai...
                        </div>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<div class="modal" id="modalOperaio">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="titoloModal">
                Aggiungi operaio
            </h2>

            <button class="close" onclick="chiudiModal()">
                ×
            </button>

        </div>


        <form id="formOperaio">

            <input
                type="hidden"
                id="operaioId"
            >


            <div class="form-grid">

                <div class="form-group">

                    <label for="nome">
                        Nome *
                    </label>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="cognome">
                        Cognome *
                    </label>

                    <input
                        id="cognome"
                        type="text"
                        placeholder="Cognome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="email@esempio.it"
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Telefono
                    </label>

                    <input
                        id="telefono"
                        type="text"
                        placeholder="Numero di telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="mansione">
                        Mansione
                    </label>

                    <input
                        id="mansione"
                        type="text"
                        placeholder="Es. Montatore"
                    >

                </div>


                <div class="form-group">

                    <label for="dataAssunzione">
                        Data assunzione
                    </label>

                    <input
                        id="dataAssunzione"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="stato">
                        Stato
                    </label>

                    <select id="stato">

                        <option value="Attivo">
                            Attivo
                        </option>

                        <option value="Non attivo">
                            Non attivo
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="chiudiModal()"
                >
                    ANNULLA
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    SALVA OPERAIO
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    let operai = [];


    function mostraErrore(messaggio) {

        const box =
            document.getElementById("errore");

        box.textContent = messaggio;

        box.style.display = "block";

    }


    function nascondiErrore() {

        document
            .getElementById("errore")
            .style.display = "none";

    }


    async function caricaOperai() {

        try {

            nascondiErrore();

            const risposta =
                await fetch("/api/operai");


            if (!risposta.ok) {

                throw new Error(
                    "Impossibile caricare gli operai."
                );

            }


            operai =
                await risposta.json();


            mostraOperai();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    function apriNuovoOperaio() {

        document
            .getElementById("formOperaio")
            .reset();

        document
            .getElementById("operaioId")
            .value = "";

        document
            .getElementById("titoloModal")
            .textContent =
            "Aggiungi operaio";

        document
            .getElementById("modalOperaio")
            .classList.add("show");

    }


    function chiudiModal() {

        document
            .getElementById("modalOperaio")
            .classList.remove("show");

    }


    document
        .getElementById("formOperaio")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                nascondiErrore();


                const id =
                    document
                        .getElementById("operaioId")
                        .value;


                const dati = {

                    nome:
                        document
                            .getElementById("nome")
                            .value
                            .trim(),

                    cognome:
                        document
                            .getElementById("cognome")
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById("email")
                            .value
                            .trim(),

                    telefono:
                        document
                            .getElementById("telefono")
                            .value
                            .trim(),

                    mansione:
                        document
                            .getElementById("mansione")
                            .value
                            .trim(),

                    data_assunzione:
                        document
                            .getElementById("dataAssunzione")
                            .value,

                    stato:
                        document
                            .getElementById("stato")
                            .value

                };


                try {

                    let risposta;


                    if (id) {

                        risposta =
                            await fetch(
                                `/api/operai/${id}`,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    } else {

                        risposta =
                            await fetch(
                                "/api/operai",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(dati)
                                }
                            );

                    }


                    const risultato =
                        await risposta.json();


                    if (!risposta.ok) {

                        throw new Error(
                            risultato.errore ||
                            "Errore durante il salvataggio."
                        );

                    }


                    chiudiModal();

                    await caricaOperai();

                } catch (errore) {

                    mostraErrore(
                        errore.message
                    );

                }

            }
        );


    function modificaOperaio(id) {

        const operaio =
            operai.find(
                item =>
                    item.id === id
            );


        if (!operaio) {
            return;
        }


        document
            .getElementById("operaioId")
            .value =
            operaio.id;


        document
            .getElementById("nome")
            .value =
            operaio.nome || "";


        document
            .getElementById("cognome")
            .value =
            operaio.cognome || "";


        document
            .getElementById("email")
            .value =
            operaio.email || "";


        document
            .getElementById("telefono")
            .value =
            operaio.telefono || "";


        document
            .getElementById("mansione")
            .value =
            operaio.mansione || "";


        document
            .getElementById("dataAssunzione")
            .value =
            operaio.data_assunzione || "";


        document
            .getElementById("stato")
            .value =
            operaio.stato || "Attivo";


        document
            .getElementById("titoloModal")
            .textContent =
            "Modifica operaio";


        document
            .getElementById("modalOperaio")
            .classList.add("show");

    }


    async function cambiaStato(id) {

        const operaio =
            operai.find(
                item =>
                    item.id === id
            );


        if (!operaio) {
            return;
        }


        const nuovoStato =
            operaio.stato === "Attivo"
            ? "Non attivo"
            : "Attivo";


        try {

            const risposta =
                await fetch(
                    `/api/operai/${id}/stato`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                stato: nuovoStato
                            })
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante la modifica dello stato."
                );

            }


            await caricaOperai();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    async function eliminaOperaio(id) {

        const conferma =
            confirm(
                "Sei sicuro di voler eliminare questo operaio?"
            );


        if (!conferma) {
            return;
        }


        try {

            const risposta =
                await fetch(
                    `/api/operai/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const risultato =
                await risposta.json();


            if (!risposta.ok) {

                throw new Error(
                    risultato.errore ||
                    "Errore durante l'eliminazione."
                );

            }


            await caricaOperai();

        } catch (errore) {

            mostraErrore(
                errore.message
            );

        }

    }


    function mostraOperai() {

        const tbody =
            document
                .getElementById("tabellaOperai");


        const ricerca =
            document
                .getElementById("ricerca")
                .value
                .toLowerCase()
                .trim();


        const filtrati =
            operai.filter(operaio => {

                const testo = (

                    operaio.nome + " " +
                    operaio.cognome + " " +
                    (operaio.email || "") + " " +
                    (operaio.telefono || "") + " " +
                    (operaio.mansione || "")

                ).toLowerCase();


                return testo.includes(
                    ricerca
                );

            });


        tbody.innerHTML = "";


        if (filtrati.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="empty">
                            ${
                                operai.length === 0
                                ? "Nessun operaio presente nel database."
                                : "Nessun risultato trovato."
                            }
                        </div>
                    </td>
                </tr>
            `;

        } else {

            filtrati.forEach(operaio => {

                const riga =
                    document.createElement("tr");


                const classeStato =
                    operaio.stato === "Attivo"
                    ? "active"
                    : "inactive";


                const testoStato =
                    operaio.stato || "Attivo";


                riga.innerHTML = `

                    <td class="name">
                        ${escapeHtml(
                            operaio.nome
                        )}
                        ${escapeHtml(
                            operaio.cognome
                        )}
                    </td>

                    <td>
                        ${
                            escapeHtml(
                                operaio.telefono || "—"
                            )
                        }
                        <br>
                        <small>
                            ${
                                escapeHtml(
                                    operaio.email || ""
                                )
                            }
                        </small>
                    </td>

                    <td>
                        ${
                            escapeHtml(
                                operaio.mansione || "—"
                            )
                        }
                    </td>

                    <td>
                        ${
                            operaio.squadra_id
                            ? "Squadra #" +
                              operaio.squadra_id
                            : "Non assegnata"
                        }
                    </td>

                    <td>
                        ${
                            formattaData(
                                operaio.data_assunzione
                            )
                        }
                    </td>

                    <td>
                        <span
                            class="status ${classeStato}"
                        >
                            ${escapeHtml(
                                testoStato
                            )}
                        </span>
                    </td>

                    <td>

                        <button
                            class="action-button edit"
                            onclick="modificaOperaio(${operaio.id})"
                        >
                            Modifica
                        </button>

                        <button
                            class="action-button disable"
                            onclick="cambiaStato(${operaio.id})"
                        >
                            ${
                                operaio.stato === "Attivo"
                                ? "Disattiva"
                                : "Attiva"
                            }
                        </button>

                        <button
                            class="action-button delete"
                            onclick="eliminaOperaio(${operaio.id})"
                        >
                            Elimina
                        </button>

                    </td>

                `;


                tbody.appendChild(riga);

            });

        }


        aggiornaStatistiche();

    }


    function aggiornaStatistiche() {

        const totale =
            operai.length;


        const attivi =
            operai.filter(
                operaio =>
                    operaio.stato === "Attivo"
            ).length;


        const nonAttivi =
            operai.filter(
                operaio =>
                    operaio.stato !== "Attivo"
            ).length;


        document
            .getElementById("totaleOperai")
            .textContent =
            totale;


        document
            .getElementById("operaiAttivi")
            .textContent =
            attivi;


        document
            .getElementById("operaiNonAttivi")
            .textContent =
            nonAttivi;

    }


    function formattaData(data) {

        if (!data) {
            return "—";
        }


        const parti =
            data.split("-");


        if (parti.length !== 3) {
            return data;
        }


        return (
            parti[2] +
            "/" +
            parti[1] +
            "/" +
            parti[0]
        );

    }


    function escapeHtml(testo) {

        return String(testo)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document
                    .getElementById(
                        "modalOperaio"
                    );


            if (event.target === modal) {

                chiudiModal();

            }

        }
    );


    caricaOperai();

</script>

</body>
</html>
